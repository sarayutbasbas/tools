<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f4f4f0" />
    <script>
      (() => {
        let preference;
        try { preference = localStorage.getItem('toolbox-theme'); } catch {}
        const dark = preference === 'dark' || (preference !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        document.querySelector('meta[name="theme-color"]').content = dark ? '#171c19' : '#f4f4f0';
      })();
    </script>
    <link rel="icon" type="image/png" sizes="64x64" href="/brand/toolbox-favicon-64.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=1" />
    <link rel="manifest" href="/manifest.webmanifest?v=1" />
    <meta name="apple-mobile-web-app-title" content="Toolbox" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="description" content="Toolbox — ดาวน์โหลดและบีบอัดไฟล์มีเดียในที่เดียว" />
    <title>Toolbox — Media utility</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
